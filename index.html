    <meta name="theme-color" content="#1E40AF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme before first paint: saved choice, else the device setting (same as the portal).
      (function () {
        try {
          var t = localStorage.getItem('cl-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Learn live. Test real. Cohort Live connects trainers and students through live classes with real-time MCQs, and runs proctored GATE mock tests with GATE marking, scorecards and ranks."
